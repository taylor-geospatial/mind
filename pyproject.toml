[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.9.3,<1" ]

[project]
name = "mind"
version = "0.1.0"
description = "MIND: Matryoshka Implicit Neural Distillation location encoder"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Isaac Corley", email = "isaac.corley@taylorgeospatial.org" },
]
requires-python = ">=3.13"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cartopy",
  "faissknn[cpu]>=0.4.2; sys_platform!='linux' or platform_machine!='x86_64'",
  "faissknn[cuda]>=0.4.2; sys_platform=='linux' and platform_machine=='x86_64'",
  "geoclip>=1.2",
  "geopandas",
  "huggingface-hub",
  "joblib",
  "matplotlib>=3.10.9",
  "numpy",
  "pandas",
  "pyarrow",
  "rasterio",
  "rshf>=0.2.2",
  "s3fs",
  "safetensors",
  "scikit-learn",
  "scipy",
  "shapely",
  "torch",
  "wandb",
  "zarr>=3",
]

[dependency-groups]
dev = [
  "pre-commit>=4.3",
  "ruff>=0.14.1",
  "ty>=0.0.1a23",
]

[tool.ruff]
target-version = "py313"
line-length = 100
force-exclude = true
lint.extend-select = [
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FLY",  # flynt
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "PYI",  # flake8-pyi
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "TCH",  # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
lint.ignore = [
  "ANN401",
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "PT011",
  "PT012",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "RET505",
  "RET506",
  "RUF005",
  "SIM108",
  "TRY003",
  # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
  "W191",
]
lint.extend-per-file-ignores."scripts/**" = [
  "ANN001",
  "ANN201",
]
lint.isort.known-first-party = [ "mind" ]

[tool.ty]
# NumPy/PyTorch typing exceptions.
rules.invalid-argument-type = "ignore"
rules.not-subscriptable = "ignore"
rules.call-non-callable = "ignore"
rules.unsupported-operator = "ignore"
rules.no-matching-overload = "ignore"
rules.invalid-parameter-default = "ignore"
# Attributes missing from Zarr/scikit-learn/PyTorch stubs.
rules.unresolved-attribute = "ignore"
# Rasterio loads some submodules lazily.
rules.possibly-missing-submodule = "ignore"
environment.extra-paths = [ "scripts/paper" ]
